<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA Radar · Claude, Gemini, ChatGPT</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--mu:#6b6a66;--bd:#e8e6dc;--claude:#d97757;--gemini:#4f7cff;--chatgpt:#10a37f;--media:#7c6bd6;--sh:0 1px 2px #0000000a,0 8px 24px #00000008}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1a18;--card:#262523;--tx:#f1efe8;--mu:#a3a099;--bd:#38362f;--sh:none}}
:root[data-theme=dark]{--bg:#1b1a18;--card:#262523;--tx:#f1efe8;--mu:#a3a099;--bd:#38362f;--sh:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--bd)}
.bar{max-width:1120px;margin:auto;padding:12px 5vw;display:flex;align-items:center;gap:14px}

/* Nouveau Logo Animé */
.logo{font-family:ui-serif,Georgia,serif;font-size:1.25rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap; display:flex; align-items:center;}
.radar-icon {display:inline-block; width:14px; height:14px; border-radius:50%; background:var(--gemini); position:relative; margin-right:8px; animation:pulse 2s infinite;}
@keyframes pulse {
  0% { box-shadow:0 0 0 0 rgba(79,124,255,0.7); }
  70% { box-shadow:0 0 0 8px rgba(79,124,255,0); }
  100% { box-shadow:0 0 0 0 rgba(79,124,255,0); }
}

nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1; align-items:center;}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--mu);font:inherit;font-size:.93rem;padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:.15s; display:flex; align-items:center; gap:6px;}
nav button:hover{color:var(--tx);background:var(--bd)}
nav button.on{color:var(--tx);background:var(--bd);font-weight:600}
#theme{border:1px solid var(--bd);background:var(--card);color:var(--tx);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem; flex-shrink:0;}
main{max-width:1120px;margin:auto;padding:0 5vw 40px}
.hero{padding:64px 0 28px;position:relative}
.hero:before{content:"";position:absolute;inset:-40px -10vw auto;height:320px;z-index:-1;background:radial-gradient(420px 220px at 18% 40%,#d9775526,transparent),radial-gradient(420px 220px at 55% 20%,#4f7cff1f,transparent),radial-gradient(380px 220px at 85% 50%,#10a37f1f,transparent)}
.hero h1{font-family:ui-serif,Georgia,serif;font-weight:500;font-size:clamp(2.1rem,5.5vw,3.6rem);line-height:1.08;letter-spacing:-.025em;margin:0 0 14px;max-width:760px}
.hero p{color:var(--mu);font-size:1.1rem;max-width:620px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:.93rem;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.chip:hover{transform:translateY(-1px)}.chip.on{border-color:var(--tx)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--mu))}
.claude{--c:var(--claude)}.gemini{--c:var(--gemini)}.chatgpt{--c:var(--chatgpt)}.media{--c:var(--media)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 6px}
.tools input{flex:1;min-width:200px;max-width:380px;padding:10px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.tools input:focus{outline:2px solid var(--c,var(--tx));outline-offset:1px}
h2{font-family:ui-serif,Georgia,serif;font-weight:500;font-size:1.6rem;letter-spacing:-.015em;margin:34px 0 4px}
.sub{color:var(--mu);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s;animation:in .4s both}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px #0000001a}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.img{height:170px;background-size:cover;background-position:center;position:relative;display:grid;place-items:center;font:600 3rem ui-serif,Georgia,serif;color:#fff;background-color:var(--c,#888);}
.new{position:absolute;top:12px;left:12px;background:#fff;color:#111;font:700 .68rem/1 system-ui;padding:6px 9px;border-radius:99px;letter-spacing:.04em; box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.play{position:absolute;right:12px;bottom:12px;background:#000b;color:#fff;font:700 .72rem system-ui;padding:6px 10px;border-radius:99px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{display:flex;align-items:center;gap:7px;font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.body h3{margin:0;font-size:1.06rem;line-height:1.35;font-weight:600}
.body p{margin:0;color:var(--mu);font-size:.92rem}
.body small{margin-top:auto;padding-top:6px;color:var(--mu)}
@media(min-width:820px){.big{flex-direction:row;grid-column:span 2}.big .img{height:auto;min-height:260px;flex:1.1}.big .body{flex:1;justify-content:center;padding:28px}.big h3{font-size:1.5rem;font-family:ui-serif,Georgia,serif;font-weight:500}}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-top:18px}
td,th{padding:14px;border-bottom:1px solid var(--bd);text-align:left;font-size:.95rem}th{color:var(--mu);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.wrap{overflow-x:auto}
.btn{display:inline-block;padding:10px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);text-decoration:none;font-size:.92rem;margin:4px 8px 4px 0}
.btn:hover{border-color:var(--tx)}
.skel{height:300px;border-radius:20px;background:linear-gradient(90deg,var(--bd),var(--card),var(--bd));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{color:var(--mu);padding:40px 0}
footer{max-width:1120px;margin:auto;padding:30px 5vw 50px;color:var(--mu);font-size:.85rem;border-top:1px solid var(--bd)}
</style>
</head>
<body>
<div class="top"><div class="bar">
  <span class="logo"><span class="radar-icon"></span> IA Radar</span>
  <nav id="nav"></nav>
  <button id="theme" title="Mode clair / sombre">◐</button>
</div></div>
<main id="app"></main>
<footer id="foot"></footer>

<script>
/* ================= DONNÉES ================= */
const RAW = "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/";

const FEEDS = [
  {company:"claude",  name:"Anthropic News", url:RAW+"feed_anthropic_news.xml"},
  {company:"claude",  name:"Claude Blog",    url:RAW+"feed_claude.xml"},
  {company:"chatgpt", name:"OpenAI News",    url:"https://openai.com/news/rss.xml"},
  {company:"gemini",  name:"Google AI Blog", url:"https://blog.google/technology/ai/rss/"},
  {company:"gemini",  name:"Google Gemini",  url:"https://blog.google/products/gemini/rss/"}
];

const MEDIA = [
  {name:"Les Numériques · IA",        url:"https://www.lesnumeriques.com/intelligence-artificielle/rss.xml"},
  {name:"Le Monde Informatique · IA", url:"https://www.lemondeinformatique.fr/flux/donnees-ia.xml"},
  {name:"Le Fil IA",                  url:"https://www.lefilia.fr/feed"}
];

const YOUTUBE = [];

/* ================= CONFIGURATION VISUELLE ================= */
const NAMES = {claude:"Claude", gemini:"Gemini", chatgpt:"ChatGPT", media:"Médias", plans:"Abonnements", deals:"Bons Plans", archive:"Archive"};
const KEY = "ia-radar-v3";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const txt = s => (s||"").replace(/<[^>]+>/g," ").replace(/&nbsp;|&#160;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ").trim();
const okUrl = u => /^https:\/\//.test(u||"");
const cssUrl = u => okUrl(u) ? u.replace(/['"()\\\s]/g,"") : "";
const fmt = d => new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
const isNew = d => Date.now() - new Date(d) < 72*36e5;
const AI_RE = /\bia\b|intelligence artificielle|chatgpt|openai|claude|anthropic|gemini|mistral|llm|gpt|deepseek|copilot|grok/i;
const MENTION = {claude:/claude|anthropic/i, chatgpt:/chatgpt|openai|\bgpt/i, gemini:/gemini|deepmind|google ai/i};

// Icônes officielles (SimpleIcons) et emojis de navigation
const ICONS = {
  home: "🏠",
  claude: `<img src="https://cdn.simpleicons.org/anthropic/d97757" width="14">`,
  gemini: `<img src="https://cdn.simpleicons.org/googlegemini/4f7cff" width="14">`,
  chatgpt: `<img src="https://cdn.simpleicons.org/openai/10a37f" width="14">`,
  media: "📰",
  plans: "💳",
  deals: "🎓",
  archive: "🗃️"
};

// Images haute définition de secours si le site officiel ne fournit pas de miniature
const FALLBACKS = {
  claude: "https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&q=80&w=600",
  chatgpt: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&q=80&w=600",
  gemini: "https://images.unsplash.com/photo-1697577418970-95d99b5a55cf?auto=format&fit=crop&q=80&w=600",
  media: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&q=80&w=600"
};

let store = [], view = location.hash.slice(1) || "home", q = "", mfocus = "focus", loaded = false;
try { store = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} };

async function pull(src, extra) {
  const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(src.url));
  const d = await r.json(); if (d.status !== "ok") throw 0;
  return d.items.map(it => {
    const enc = it.enclosure?.link, html = it.content || it.description || "";
    const img = it.thumbnail || (/\.(jpe?g|png|webp|gif)(\?|$)/i.test(enc||"") ? enc : "") || (html.match(/<img[^>]+src=["']([^"']+)/i)||[])[1] || "";
    return {...extra, title:txt(it.title), link:it.link, summary:txt(it.description).slice(0,190),
      image: okUrl(img) ? img : "", date:new Date((it.pubDate||"").replace(" ","T")+"Z").toISOString()};
  });
}

async function load() {
  const known = new Set(store.map(n => n.link)); let failed = 0;
  const jobs = [
    ...FEEDS.map(f => [f, {kind:"news", company:f.company, source:f.name}]),
    ...MEDIA.map(m => [m, {kind:"media", company:"media", source:m.name, onlyAI:!!m.onlyAI}]),
    ...YOUTUBE.map(y => [{url:"https://www.youtube.com/feeds/videos.xml?channel_id="+y.id}, {kind:"media", company:"media", source:"▶ "+y.name, video:true}])
  ];
  await Promise.all(jobs.map(async ([src, extra]) => {
    try {
      for (const n of await pull(src, extra)) {
        if (!okUrl(n.link) || known.has(n.link) || isNaN(new Date(n.date))) continue;
        if (extra.onlyAI && !AI_RE.test(n.title + " " + n.summary)) continue;
        known.add(n.link); store.push(n);
      }
    } catch { failed++; }
  }));
  store = store.filter(n => !/github\.com/.test(n.link)).sort((a,b) => b.date.localeCompare(a.date));
  save(); loaded = true;
  $("#foot").innerHTML = `Mise à jour en temps réel : ${new Date().toLocaleString("fr-FR")}${failed ? ` · ${failed} flux indisponible(s)` : ""}<br>Les liens ouvrent les sources d'origine directes.`;
  render();
}

let busy = false;
async function enrich() {
  if (busy) return; busy = true;
  const todo = [...document.querySelectorAll(".card[data-l]")].filter(c => { const n = store.find(x => x.link === c.dataset.l); return n && !n.image && !n.noimg; }).slice(0, 8);
  for (const c of todo) {
    const n = store.find(x => x.link === c.dataset.l);
    try {
      const d = await (await fetch("https://api.microlink.io/?url=" + encodeURIComponent(n.link))).json();
      const u = d?.data?.image?.url;
      if (okUrl(u)) { 
        n.image = u; 
        const el = c.querySelector(".img"); el.style.backgroundImage = `url('${cssUrl(u)}')`; 
      } else n.noimg = true;
    } catch { n.noimg = true; }
  }
  save(); busy = false;
}

const card = (n, i, big) => {
  const m = n.company, u = cssUrl(n.image) || FALLBACKS[m] || FALLBACKS.media;
  return `<a class="card ${m}${big?" big":""}" data-l="${esc(n.link)}" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer" style="animation-delay:${Math.min(i,12)*30}ms">
  <div class="img" style="background-image:url('${esc(u)}')">${isNew(n.date)?'<b class="new">NOUVEAU</b>':""}${n.video?'<b class="play">▶ Vidéo</b>':""}</div>
  <div class="body"><span class="tag"><i class="dot"></i>${ICONS[m]||""} ${esc(NAMES[m])} · ${esc(n.source)}</span><h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p><small>${fmt(n.date)}</small></div></a>`;
};
const match = n => !q || (n.title + " " + n.summary).toLowerCase().includes(q);
const tools = c => `<div class="tools ${c||""}"><input id="q" type="search" placeholder="Rechercher dans les actus…" value="${esc(q)}"></div>`;
const grid = (l, big) => l.length ? `<div class="grid">${l.map((n,i)=>card(n,i,big&&i===0&&!q)).join("")}</div>` : `<p class="empty">${loaded ? "Rien à afficher pour le moment." : ""}</p>`;
const skel = `<div class="grid">${"<div class='skel'></div>".repeat(6)}</div>`;

function render() {
  const app = $("#app"), news = store.filter(n => n.kind === "news" && match(n));
  const count = c => store.filter(n => n.kind === "news" && n.company === c).length;
  $("#nav").innerHTML = [["home","Accueil"],["claude","Claude"],["gemini","Gemini"],["chatgpt","ChatGPT"],["media","Médias"],["deals","Bons Plans"],["archive","Archive"]]
    .map(([k,l]) => `<button data-v="${k}" class="${k===view?"on":""}">${ICONS[k]} ${l}</button>`).join("");
  let h = "";
  if (view === "home") {
    h = `<section class="hero"><h1>Tout l'écosystème Claude, Gemini et ChatGPT, au même endroit.</h1>
      <p>Nouveaux modèles, abonnements, offres étudiantes : les annonces officielles, mises à jour en direct à chaque visite.</p>
      <div class="chips">${["claude","gemini","chatgpt"].map(c=>`<button class="chip ${c}" data-v="${c}">${ICONS[c]} ${NAMES[c]}${count(c)?` · ${count(c)}`:""}</button>`).join("")}<button class="chip media" data-v="media">📰 Médias français</button></div></section>
      ${tools()}<h2>À la une</h2><p class="sub">Les dernières annonces officielles des trois IA.</p>${loaded||news.length ? grid(news.slice(0,13), true) : skel}`;
  } else if (NAMES[view] && view !== "media" && view !== "deals" && view !== "archive") {
    const l = news.filter(n => n.company === view);
    h = `<section class="hero ${view}" style="padding-bottom:0"><h1>Actus ${NAMES[view]}</h1><p>Annonces officielles, avec lien direct vers la source.</p></section>${tools(view)}${loaded||l.length ? grid(l, true) : skel}`;
  } else if (view === "deals") {
    h = `<section class="hero" style="padding-bottom:0"><h1>Bons Plans Étudiants</h1><p>Comparatif des meilleures offres IA actuelles pour optimiser ton budget et tes études.</p></section>
      <div class="grid" style="margin-top:40px;">
        <!-- Gemini Pro Student -->
        <div class="card" style="border: 2px solid var(--gemini); position: relative; padding: 24px; box-shadow: 0 10px 30px rgba(79, 124, 255, 0.15);">
           <div style="position:absolute; top:-14px; right: 24px; background: var(--gemini); color: #fff; padding: 6px 14px; border-radius: 99px; font-size: 0.85rem; font-weight: 700; box-shadow: 0 4px 12px rgba(79, 124, 255, 0.3);">Le choix malin</div>
           <h3 style="font-size:1.4rem; margin:0">${ICONS["gemini"]} Google AI Pro</h3>
           <p style="font-size:2.2rem; font-weight: 800; margin: 12px 0; color:var(--tx)">~5,49 € <span style="font-size:1rem; font-weight:normal; color:var(--mu)">/ mois</span></p>
           <p style="color:var(--mu); font-size:0.95rem;"><strong>Profil ciblé :</strong> Études de niveau Master, analyse de données, intégration immédiate avec les outils bureautiques.</p>
           <ul style="padding-left: 20px; color: var(--mu); font-size:.95rem; margin-top:16px; line-height: 1.8;">
             <li>Accès intégral au modèle <strong>Argon</strong> (raisonnement)</li>
             <li>Tarif étudiant imbattable (remise appliquée)</li>
             <li>Parfait pour synthétiser des études de cas marketing</li>
           </ul>
        </div>
        <!-- ChatGPT Plus -->
        <div class="card" style="padding: 24px;">
           <h3 style="font-size:1.4rem; margin:0">${ICONS["chatgpt"]} ChatGPT Plus</h3>
           <p style="font-size:2.2rem; font-weight: 800; margin: 12px 0; color:var(--tx)">~22,00 € <span style="font-size:1rem; font-weight:normal; color:var(--mu)">(20$) / mois</span></p>
           <p style="color:var(--mu); font-size:0.95rem;"><strong>Profil ciblé :</strong> Utilisation grand public polyvalente, entraînement oral, création d'assistants sur-mesure.</p>
           <ul style="padding-left: 20px; color: var(--mu); font-size:.95rem; margin-top:16px; line-height: 1.8;">
             <li>Référence du marché</li>
             <li>Mode vocal naturel extrêmement réactif</li>
             <li><strong>Plein tarif</strong> (pas de remise étudiante)</li>
           </ul>
        </div>
        <!-- Claude Pro -->
        <div class="card" style="padding: 24px;">
           <h3 style="font-size:1.4rem; margin:0">${ICONS["claude"]} Claude Pro</h3>
           <p style="font-size:2.2rem; font-weight: 800; margin: 12px 0; color:var(--tx)">~22,00 € <span style="font-size:1rem; font-weight:normal; color:var(--mu)">(20$) / mois</span></p>
           <p style="color:var(--mu); font-size:0.95rem;"><strong>Profil ciblé :</strong> Développeurs, codeurs informatiques, ingénierie, lecture de très longs PDF.</p>
           <ul style="padding-left: 20px; color: var(--mu); font-size:.95rem; margin-top:16px; line-height: 1.8;">
             <li>Excellente rédaction (phrases très fluides)</li>
             <li>Fonction "Computer Use" (réservée aux pros)</li>
             <li><strong>Plein tarif</strong> (pas de remise étudiante)</li>
           </ul>
        </div>
      </div>`;
  } else if (view === "media") {
    let l = store.filter(n => n.kind === "media" && match(n));
    if (mfocus !== "all") l = l.filter(n => mfocus === "focus" ? Object.values(MENTION).some(r => r.test(n.title+" "+n.summary)) : MENTION[mfocus].test(n.title+" "+n.summary));
    const vids = l.filter(n => n.video), arts = l.filter(n => !n.video);
    const yt = k => `https://www.youtube.com/results?search_query=${encodeURIComponent(k)}&sp=CAI%253D`;
    h = `<section class="hero" style="padding-bottom:0"><h1>Ce que la presse et les vidéastes en disent</h1><p>Médias français spécialisés. Par défaut, seuls les articles qui parlent de Claude, Gemini ou ChatGPT sont affichés.</p></section>
      <div class="chips">${[["focus","Focus 3 IA"],["claude","Claude"],["gemini","Gemini"],["chatgpt","ChatGPT"],["all","Toute l'IA"]].map(([k,t])=>`<button class="chip ${NAMES[k]?k:""} ${mfocus===k?"on":""}" data-m="${k}">${t}</button>`).join("")}</div>${tools("media")}
      <h2>Vidéos</h2>${vids.length ? grid(vids) : `<p class="sub">${YOUTUBE.length ? "Aucune vidéo pour ce filtre." : "La liste des chaînes YouTube est en cours de configuration."}</p>`}
      <p>${["actus Claude","actus Gemini","actus ChatGPT"].map(k=>`<a class="btn" target="_blank" rel="noopener noreferrer" href="${yt(k+" français")}">▶ ${esc(k)} sur YouTube</a>`).join("")}</p>
      <h2>Articles</h2>${loaded||arts.length ? grid(arts) : skel}`;
  } else if (view === "archive") {
    const by = {}; news.forEach(n => (by[n.date.slice(0,7)] ||= []).push(n));
    h = `<section class="hero" style="padding-bottom:0"><h1>Archive</h1><p>Toutes les annonces déjà vues, classées par mois.</p></section>${tools()}` +
      (Object.keys(by).sort().reverse().map(m => `<h2>${new Date(m+"-01").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</h2>${grid(by[m])}`).join("") || `<p class="empty">Rien pour l'instant.</p>`);
  }
  app.innerHTML = h;
  const inp = $("#q"); if (inp) inp.oninput = e => { q = e.target.value.toLowerCase(); const pos = e.target.selectionStart; render(); const i2 = $("#q"); i2.focus(); i2.setSelectionRange(pos,pos); };
  enrich();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-v],[data-m]"); if (!b) return;
  if (b.dataset.m) { mfocus = b.dataset.m; render(); }
  else { view = b.dataset.v; q = ""; location.hash = view; scrollTo({top:0}); }
});
addEventListener("hashchange", () => { view = location.hash.slice(1) || "home"; render(); });
$("#theme").onclick = () => { const d = document.documentElement, dark = getComputedStyle(d).getPropertyValue("--bg").trim() === "#1b1a18"; d.dataset.theme = dark ? "light" : "dark"; };

render(); load();
</script>
</body>
</html>
