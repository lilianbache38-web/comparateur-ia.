  if (t.closest("[data-fav]")) { favs.has(l) ? favs.delete(l) : favs.add(l); save(); const b = t.closest("[data-fav]"); b.classList.toggle("on"); b.textContent = favs.has(l) ? "♥" : "♡"; if (view === "fav") render(); else $("#nav button:last-child").textContent = "♥ Favoris" + (favs.size ? " " + favs.size : ""); return; }
  if (t.closest("[data-read]")) { read.has(l) ? read.delete(l) : read.add(l); save(); c.classList.toggle("read"); return; }
  if (t.closest("[data-share]")) { const n = find(l); if (navigator.share) navigator.share({title:n.title, url:l}).catch(() => {}); else navigator.clipboard?.writeText(l).then(() => toast("Lien copié ✓")); return; }
  const pl = t.closest("[data-play]"); if (pl) { e.preventDefault(); if (c) { read.add(l); save(); c.classList.add("read"); } $("#modal .box").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(pl.dataset.play)}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Vidéo"></iframe>`; $("#modal").classList.add("on"); return; }
  if (t.closest(".card a[href]") && c) { read.add(l); save(); c.classList.add("read"); return; }
  const an = t.closest("[data-ans]"); if (an) { const s = QUIZ[Q.i].a[+an.dataset.ans][1]; for (const k in s) Q.s[k] += s[k]; Q.i++; return render(); }
  if (t.closest("[data-qreset]")) { Q.i = 0; Q.s = {claude:0,gemini:0,chatgpt:0}; return render(); }
  const cp = t.closest("[data-copy]"); if (cp) return navigator.clipboard?.writeText(GUIDES[+cp.dataset.copy].p).then(() => toast("Prompt copié ✓"));
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { F.q = t.value.toLowerCase(); fill(); }
  else if (t.id === "gq") $("#gl").innerHTML = glossHtml(t.value.toLowerCase());
  else if (t.id === "pq") { const q = t.value.toLowerCase(); $("#pr").innerHTML = q ? news.filter(n => `${n.title} ${n.summary}`.toLowerCase().includes(q)).slice(0, 8).map(n => `<a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer"><b style="color:var(--${n.company})">${NAMES[n.company]}</b> ${esc(n.title)}</a>`).join("") || '<p class="note">Aucun résultat.</p>' : ""; }
  else if (t.closest(".calc")) calc();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "days") { F.days = +t.value; render(); } else if (t.id === "sort") { F.sort = t.value; render(); } else if (t.id === "hide") { F.hide = t.checked; render(); }
  else if (t.id === "pst") { P.stu = t.checked; render(); } else if (t.id === "psort") { P.sort = t.value; render(); }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palette(true); }
  else if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); palette(true); }
  else if (e.key === "Escape") { palette(false); $("#modal").classList.remove("on"); $("#modal .box").innerHTML = ""; }
  else if (e.key === "Enter" && e.target.id === "pq") $("#pr a")?.click();
});
addEventListener("hashchange", () => { view = location.hash.slice(1) || "home"; render(); });
$("#srch").onclick = () => palette(true);
$("#theme").onclick = () => { const d = document.documentElement, dark = getComputedStyle(d).getPropertyValue("--bg").trim() === "#1b1a18"; d.dataset.theme = dark ? "light" : "dark"; ls.set("theme", d.dataset.theme); };
const fs = d => { const v = Math.min(130, Math.max(85, ls.get("fs", 100) + d)); ls.set("fs", v); document.documentElement.style.fontSize = v + "%"; };
$("#fsm").onclick = () => fs(-8); $("#fsp").onclick = () => fs(8);
if (ls.get("theme")) document.documentElement.dataset.theme = ls.get("theme"); fs(0);

render(); load();
</script>
