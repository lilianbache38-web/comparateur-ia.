<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA Radar · Claude, Gemini, ChatGPT</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--tx:#e8eaf0;--mu:#9aa0b4}
@media(prefers-color-scheme:light){:root{--bg:#f6f7fb;--card:#fff;--tx:#161922;--mu:#5b6275}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 5vw;border-bottom:1px solid #8884}
header b{font-size:1.2rem;margin-right:auto}
button{padding:8px 14px;border-radius:99px;border:1px solid #8886;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.on{background:var(--tx);color:var(--bg)}
main{max-width:1100px;margin:auto;padding:24px 5vw}h1{margin:10px 0 4px}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:16px}
.card{background:var(--card);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.img{height:150px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:2.5rem;font-weight:700;color:#fff9}
.body{padding:14px}.body h3{margin:6px 0;font-size:1.05rem}.tag{font-size:.75rem;font-weight:700;text-transform:uppercase}
.claude .img{background-image:linear-gradient(135deg,#d97757,#7a3b28)}.claude .tag{color:#d97757}
.gemini .img{background-image:linear-gradient(135deg,#4f8cff,#7b4fff)}.gemini .tag{color:#4f8cff}
.chatgpt .img{background-image:linear-gradient(135deg,#10a37f,#0b5d48)}.chatgpt .tag{color:#10a37f}
table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:10px;border-bottom:1px solid #8883;text-align:left}
footer{padding:30px 5vw;color:var(--mu);text-align:center;font-size:.9rem}
</style>
</head>
<body>
<header>
  <b>🛰️ IA Radar</b>
  <button data-v="all" class="on">Tout</button>
  <button data-v="claude">Claude</button>
  <button data-v="gemini">Gemini</button>
  <button data-v="chatgpt">ChatGPT</button>
  <button data-v="plans">Abonnements</button>
  <button data-v="archive">Archive</button>
</header>
<main>
  <h1 id="title">Les nouveautés de Claude, Gemini et ChatGPT</h1>
  <p class="mu" id="sub"></p>
  <div id="out"></div>
</main>
<footer id="foot"></footer>

<script>
/* ====== À MODIFIER ====== */

// Sources (flux RSS/Atom officiels). Ajoute une ligne pour une nouvelle source.
const FEEDS = [
  {company:"chatgpt", name:"OpenAI News",        url:"https://openai.com/news/rss.xml"},
  {company:"gemini",  name:"Google AI Blog",     url:"https://blog.google/technology/ai/rss/"},
  {company:"gemini",  name:"Google Gemini Blog", url:"https://blog.google/products/gemini/rss/"},
  {company:"claude",  name:"Claude Code (GitHub)", url:"https://github.com/anthropics/claude-code/releases.atom"}
];

// Abonnements : à remplir à la main, uniquement avec ce que tu as vérifié sur la page officielle.
const PLANS = [
  {company:"claude",  offre:"Abonnements Claude",  prix:"À renseigner", etudiant:"À vérifier", verifie:"JJ/MM/AAAA", source:"https://claude.com/pricing"},
  {company:"chatgpt", offre:"Abonnements ChatGPT", prix:"À renseigner", etudiant:"À vérifier", verifie:"JJ/MM/AAAA", source:"https://openai.com/chatgpt/pricing/"},
  {company:"gemini",  offre:"Google AI (Gemini)",  prix:"À renseigner", etudiant:"À vérifier", verifie:"JJ/MM/AAAA", source:"https://one.google.com/about/google-ai-plans/"}
];

/* ====== CODE ====== */
const NAMES = {claude:"Claude", gemini:"Gemini", chatgpt:"ChatGPT"};
const KEY = "ia-radar-archive-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip = s => esc((s||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim().slice(0,200));
const fmt = d => new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
const okUrl = u => /^https:\/\//.test(u||"");
const cssUrl = u => okUrl(u) ? u.replace(/['"()\\\s]/g,"") : "";

let store = [], view = "all";
try { store = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}

const card = n => {
  const img = cssUrl(n.image);
  return `<a class="card ${esc(n.company)}" href="${okUrl(n.link)?esc(n.link):"#"}" target="_blank" rel="noopener noreferrer">
  <div class="img" ${img?`style="background-image:url('${esc(img)}')"`:""}>${img?"":esc(NAMES[n.company][0])}</div>
  <div class="body"><span class="tag">${esc(NAMES[n.company])} · ${esc(n.source)}</span>
  <h3>${esc(n.title)}</h3><p class="mu">${n.summary}</p><small class="mu">${fmt(n.date)}</small></div></a>`;
};

async function load() {
  $("#sub").textContent = "Chargement des dernières actus…";
  const known = new Set(store.map(n => n.link));
  let failed = 0;
  await Promise.all(FEEDS.map(async f => {
    try {
      const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(f.url));
      const d = await r.json();
      if (d.status !== "ok") throw 0;
      for (const it of d.items) {
        if (!okUrl(it.link) || known.has(it.link)) continue;
        known.add(it.link);
        store.push({company:f.company, source:f.name, title:it.title, link:it.link,
          summary:strip(it.description), image:it.thumbnail || it.enclosure?.link || "",
          date:new Date((it.pubDate||"").replace(" ","T")+"Z").toISOString()});
      }
    } catch { failed++; }
  }));
  store = store.filter(n => !isNaN(new Date(n.date))).sort((a,b) => b.date.localeCompare(a.date));
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {}
  $("#foot").textContent = "Mis à jour : " + new Date().toLocaleString("fr-FR") +
    (failed ? ` · ${failed} source(s) indisponible(s) pour le moment` : "") +
    " · Les liens renvoient vers les sources officielles.";
  render();
}

function render() {
  const out = $("#out");
  $("#sub").textContent = "";
  document.querySelectorAll("header button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  if (view === "plans") {
    $("#title").textContent = "Abonnements & offres étudiantes";
    $("#sub").textContent = "Toujours vérifier sur la page officielle avant de s'abonner.";
    out.innerHTML = `<table><tr><th>IA</th><th>Offre</th><th>Prix</th><th>Étudiants</th><th>Vérifié le</th><th>Source</th></tr>` +
      PLANS.map(p => `<tr><td>${esc(NAMES[p.company])}</td><td>${esc(p.offre)}</td><td>${esc(p.prix)}</td><td>${esc(p.etudiant)}</td><td>${esc(p.verifie)}</td><td><a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">Officiel ↗</a></td></tr>`).join("") + `</table>`;
    return;
  }
  if (view === "archive") {
    $("#title").textContent = "Archive";
    $("#sub").textContent = "Toutes les actus déjà vues, classées par mois.";
    const by = {};
    store.forEach(n => (by[n.date.slice(0,7)] ||= []).push(n));
    out.innerHTML = Object.keys(by).sort().reverse().map(m =>
      `<h2>${new Date(m+"-01").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</h2><div class="grid">${by[m].map(card).join("")}</div>`).join("") || `<p class="mu">Rien pour l'instant.</p>`;
    return;
  }
  const l = store.filter(n => view === "all" || n.company === view);
  $("#title").textContent = view === "all" ? "Les nouveautés de Claude, Gemini et ChatGPT" : "Actus " + NAMES[view];
  const shown = l.slice(0, 18);
  out.innerHTML = shown.length ? `<div class="grid">${shown.map(card).join("")}</div>` : `<p class="mu">Aucune actu chargée pour l'instant. Réessaie dans un instant.</p>`;
}

document.querySelector("header").onclick = e => { if (e.target.dataset.v) { view = e.target.dataset.v; render(); } };
render();
load();
</script>
</body>
</html>
