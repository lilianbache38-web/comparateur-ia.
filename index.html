<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA Radar · Veille 100% Française</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--mu:#6b6a66;--bd:#e8e6dc;--claude:#d97757;--gemini:#4f7cff;--chatgpt:#10a37f;--media:#7c6bd6;--sh:0 1px 2px #0000000a,0 8px 24px #00000008}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1a18;--card:#262523;--tx:#f1efe8;--mu:#a3a099;--bd:#38362f;--sh:none}}
:root[data-theme=dark]{--bg:#1b1a18;--card:#262523;--tx:#f1efe8;--mu:#a3a099;--bd:#38362f;--sh:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.claude{--c:var(--claude)}.gemini{--c:var(--gemini)}.chatgpt{--c:var(--chatgpt)}.media{--c:var(--media)}

/* En-tête et Navigation */
.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--bd)}
.bar{max-width:1120px;margin:auto;padding:12px 5vw;display:flex;align-items:center;gap:14px}
.logo{font-family:ui-serif,Georgia,serif;font-size:1.3rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;color:var(--tx)}
.radar-icon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--gemini);position:relative;margin-right:10px;color:#fff;font-size:14px}
.radar-icon::after{content:'';position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid var(--gemini);animation:radar-pulse 2s infinite ease-out}
@keyframes radar-pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.8);opacity:0}}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;align-items:center}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--mu);font:inherit;font-size:.93rem;font-weight:500;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:.2s;display:flex;align-items:center;gap:8px}
nav button:hover{color:var(--tx);background:var(--bd)}
nav button.on{color:var(--tx);background:var(--bd);font-weight:700}
nav button img,.tag img{width:16px;height:16px}
#theme{border:1px solid var(--bd);background:var(--card);color:var(--tx);height:36px;width:36px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0}
#theme:hover{border-color:var(--tx)}

/* Structure principale */
main{max-width:1120px;margin:auto;padding:0 5vw 40px}
.hero{padding:50px 0 20px;position:relative}
.hero h1{font-family:ui-serif,Georgia,serif;font-weight:600;font-size:clamp(2rem,5vw,3rem);line-height:1.1;letter-spacing:-.02em;margin:0 0 12px;max-width:800px}
.hero p{color:var(--mu);font-size:1.1rem;max-width:650px;margin:0}
h2{font-family:ui-serif,Georgia,serif;font-weight:600;font-size:1.6rem;letter-spacing:-.015em;margin:34px 0 12px}
.empty,.note{color:var(--mu);padding:20px 0}

/* Grille et Cartes Articles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s;animation:in .4s both}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px #0000001a}
@keyframes in{from{opacity:0;transform:translateY(10px)}}

.img{height:180px;position:relative;overflow:hidden;background:var(--bd)}
.img .ph{position:absolute;inset:0;display:grid;place-items:center;font:600 3rem ui-serif,Georgia,serif;color:#fff;background:radial-gradient(240px 160px at 20% 20%,#ffffff40,transparent),linear-gradient(135deg,var(--c,#888),color-mix(in srgb,var(--c,#888) 55%,#000))}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.new{position:absolute;top:12px;left:12px;z-index:2;background:#fff;color:#111;font:700 .7rem system-ui;padding:6px 10px;border-radius:99px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.gen{position:absolute;right:10px;bottom:10px;z-index:2;background:#000a;color:#fff;font:600 .68rem system-ui;padding:5px 9px;border-radius:99px}
.body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tx)}
.body h3{margin:0;font-size:1.1rem;line-height:1.4;font-weight:700}
.body p{margin:0;color:var(--mu);font-size:.95rem;line-height:1.5}
.body small{margin-top:auto;padding-top:10px;color:var(--mu);font-size:.85rem}

/* Bons Plans */
.deal-card{padding:24px;border:2px solid var(--bd);position:relative}
.deal-card.best{border-color:var(--gemini);background:linear-gradient(to bottom,rgba(79,124,255,.05),transparent)}
.deal-badge{position:absolute;top:-14px;right:20px;background:var(--gemini);color:#fff;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700}
.deal-price{font-size:2.5rem;font-weight:800;margin:10px 0;color:var(--tx);font-family:system-ui}
.deal-price span{font-size:1rem;font-weight:500;color:var(--mu)}
.deal-list{padding-left:20px;color:var(--mu);margin-top:16px;line-height:1.7}
.deal-list strong{color:var(--tx)}
footer{max-width:1120px;margin:auto;padding:26px 5vw 50px;color:var(--mu);font-size:.85rem;border-top:1px solid var(--bd)}
</style>
</head>
<body>

<div class="top">
  <div class="bar">
    <span class="logo"><span class="radar-icon">✦</span> IA RADAR</span>
    <nav id="nav"></nav>
    <button id="theme" title="Mode clair / sombre">◐</button>
  </div>
</div>

<main id="app"></main>
<footer id="foot"></footer>

<script>
/* ================= SOURCES ================= */
const RAW = "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/";
const FEEDS = [
  {company:"claude",  name:"Anthropic News", url:RAW+"feed_anthropic_news.xml"},
  {company:"chatgpt", name:"OpenAI News",    url:"https://openai.com/news/rss.xml"},
  {company:"gemini",  name:"Google AI Blog", url:"https://blog.google/technology/ai/rss/"}
];
const MEDIA = [
  {name:"Journal du Geek", url:"https://www.journaldugeek.com/feed/", onlyAI:true},
  {name:"Les Numériques",  url:"https://www.lesnumeriques.com/intelligence-artificielle/rss.xml"}
];

/* ================= ICÔNES (avec repli si l'icône n'existe plus) ================= */
const ico = (slug, color, fallback) => `<img src="https://cdn.simpleicons.org/${slug}/${color}" alt="" onerror="this.outerHTML='${fallback}'">`;
const ICONS = {
  home:"🏠", media:"📰", deals:"🎓", archive:"🗃️",
  claude: ico("anthropic","d97757","🟠"),
  gemini: ico("googlegemini","4f7cff","🔵"),
  chatgpt: ico("openai","10a37f","🟢")
};
const NAMES = {claude:"Claude", gemini:"Gemini", chatgpt:"ChatGPT", media:"Médias", deals:"Bons Plans", archive:"Archive"};

/* ================= OUTILS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const txt = s => (s||"").replace(/<[^>]+>/g," ").replace(/&nbsp;|&#160;/g," ").replace(/&amp;/g,"&").replace(/&#8217;/g,"’").replace(/\s+/g," ").trim();
const okUrl = u => /^https:\/\//.test(u||"");
const fmt = d => new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
const AI_RE = /\bia\b|intelligence artificielle|chatgpt|openai|claude|anthropic|gemini|mistral|llm|gpt|deepseek|copilot|grok/i;
const hash = s => [...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0, 7);

const KEY = "ia-radar-v3", TRK = "ia-radar-tr-v1";
let store = [], tr = {}, view = location.hash.slice(1) || "home", loaded = false;
try { store = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}
try { tr = JSON.parse(localStorage.getItem(TRK) || "{}"); } catch {}
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(store.slice(0, 400))); } catch {}
  try { localStorage.setItem(TRK, JSON.stringify(tr)); } catch {}
};
const find = link => store.find(x => x.link === link);

/* ================= TRADUCTION AUTOMATIQUE EN FRANÇAIS ================= */
async function toFr(text) {
  if (!text) return text;
  if (tr[text]) return tr[text];
  const q = encodeURIComponent(text.slice(0, 450));
  try {  // 1) Google Translate (point d'accès non officiel, sans quota)
    const d = await (await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=fr&dt=t&q=" + q)).json();
    const t = d[0].map(x => x[0]).join("");
    if (t) return (tr[text] = t);
  } catch {}
  try {  // 2) MyMemory (secours)
    const d = await (await fetch("https://api.mymemory.translated.net/get?q=" + q + "&langpair=en|fr")).json();
    const t = d?.responseData?.translatedText;
    if (t && d.responseStatus == 200 && !/MYMEMORY WARNING|QUERY LENGTH/i.test(t)) return (tr[text] = t);
  } catch {}
  return null;
}

/* ================= IMAGES ================= */
// 1) image du flux  2) image de couverture de la page de l'article  3) illustration générée par IA à partir de l'article
async function ogImage(link) {
  try {
    const d = await (await fetch("https://api.microlink.io/?url=" + encodeURIComponent(link))).json();
    const u = d?.data?.image?.url; return okUrl(u) ? u : null;
  } catch { return null; }
}
const STYLE = {claude:"warm terracotta and cream color palette", gemini:"blue and violet gradient color palette", chatgpt:"emerald green and teal color palette", media:"soft purple and neutral color palette"};
function genUrl(n) {
  const p = `Editorial illustration for a tech news article, modern flat vector style, ${STYLE[n.company]||STYLE.media}, clean composition, no text, no letters, no logos. Subject: ${n.title}. ${(n.summary||"").slice(0,120)}`;
  return "https://image.pollinations.ai/prompt/" + encodeURIComponent(p) + "?width=800&height=450&nologo=true&seed=" + hash(n.link);
}
function setImage(c, n, url, gen) {
  n.image = url; n.gen = gen;
  const box = c.querySelector(".img"); let im = box.querySelector("img");
  if (!im) { im = document.createElement("img"); im.loading = "lazy"; im.alt = ""; im.referrerPolicy = "no-referrer"; box.querySelector(".ph").after(im); }
  im.src = url;
  if (gen && !box.querySelector(".gen")) box.insertAdjacentHTML("beforeend", '<b class="gen">Illustration IA</b>');
}
// Si une image ne charge pas : on passe à l'illustration IA, et si elle échoue aussi, on garde le visuel de couleur.
document.addEventListener("error", e => {
  const im = e.target; if (im.tagName !== "IMG" || !im.closest(".img")) return;
  const c = im.closest(".card"), n = find(c.dataset.l); if (!n) return;
  if (!n.gen) setImage(c, n, genUrl(n), true);
  else { im.remove(); n.image = ""; n.noimg = true; }
}, true);

/* ================= CHARGEMENT DES FLUX ================= */
async function pull(src, extra) {
  const d = await (await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(src.url))).json();
  if (d.status !== "ok") throw 0;
  return d.items.map(it => {
    const html = it.content || it.description || "";
    const img = it.thumbnail || (html.match(/<img[^>]+src=["']([^"']+)/i)||[])[1] || "";
    return {...extra, title:txt(it.title), link:it.link, summary:txt(it.description || it.content).slice(0,200),
      image: okUrl(img) ? img : "", date:new Date((it.pubDate||"").replace(" ","T")+"Z").toISOString()};
  });
}
async function load() {
  const known = new Set(store.map(n => n.link)); let failed = 0;
  const jobs = [...FEEDS.map(f => [f, {kind:"news", company:f.company, source:f.name}]),
                ...MEDIA.map(m => [m, {kind:"media", company:"media", source:m.name, onlyAI:!!m.onlyAI}])];
  await Promise.all(jobs.map(async ([src, extra]) => {
    try {
      for (const n of await pull(src, extra)) {
        if (!okUrl(n.link) || known.has(n.link) || isNaN(new Date(n.date))) continue;
        if (extra.onlyAI && !AI_RE.test(n.title + " " + n.summary)) continue;
        known.add(n.link); store.push(n);
      }
    } catch { failed++; }
  }));
  store.sort((a,b) => b.date.localeCompare(a.date));
  loaded = true; save();
  $("#foot").innerHTML = `Mis à jour : ${new Date().toLocaleString("fr-FR")}${failed ? ` · ${failed} source(s) indisponible(s)` : ""}<br>Titres et résumés traduits automatiquement en français. Les illustrations marquées « IA » sont générées à partir du titre de l'article.`;
  render();
}

/* ================= ENRICHISSEMENT : traduction + images ================= */
let running = false;
async function work(c) {
  const n = find(c.dataset.l); if (!n) return;
  if (n.kind === "news" && !n.fr && !n.frTried) {
    const [t, s] = await Promise.all([toFr(n.title), toFr(n.summary)]);
    n.frTried = true;
    if (t) { n.fr = {t, s: s || n.summary}; c.querySelector("h3").textContent = n.fr.t; c.querySelector("p").textContent = n.fr.s; }
  }
  if (!n.image && !n.noimg) {
    const u = await ogImage(n.link);
    if (u) setImage(c, n, u, false); else setImage(c, n, genUrl(n), true);
  }
}
async function enrich() {
  if (running) return; running = true;
  const cards = [...document.querySelectorAll(".card[data-l]")].slice(0, 30);
  for (let i = 0; i < cards.length; i += 4) await Promise.all(cards.slice(i, i+4).map(c => work(c).catch(()=>{})));
  save(); running = false;
}

/* ================= AFFICHAGE ================= */
const card = n => {
  const t = n.fr?.t || n.title, s = n.fr?.s || n.summary, recent = Date.now() - new Date(n.date) < 172800000;
  return `<a class="card ${n.company}" data-l="${esc(n.link)}" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">
    <div class="img"><div class="ph">${esc((NAMES[n.company]||"?")[0])}</div>${n.image?`<img loading="lazy" alt="" referrerpolicy="no-referrer" src="${esc(n.image)}">`:""}${recent?'<b class="new">RÉCENT</b>':""}${n.gen&&n.image?'<b class="gen">Illustration IA</b>':""}</div>
    <div class="body">
      <span class="tag">${ICONS[n.company]||"📰"} ${esc(NAMES[n.company]||"Tech")} · ${esc(n.source)}</span>
      <h3>${esc(t)}</h3><p>${esc(s)}</p><small>${fmt(n.date)}</small>
    </div></a>`;
};
const grid = l => l.length ? `<div class="grid">${l.map(card).join("")}</div>` : `<p class="empty">${loaded ? "Rien à afficher pour le moment." : "Chargement des actualités…"}</p>`;

const DEALS = `<div class="hero"><h1>Comparatif Étudiant</h1><p>Tarifs indicatifs : vérifie toujours sur la page officielle avant de t'abonner.</p></div>
  <div class="grid">
    <div class="card deal-card best"><div class="deal-badge">N°1 Étudiant</div>
      <h3>${ICONS.gemini} Google AI Pro (Gemini)</h3><p class="deal-price">~5,49 € <span>/ mois</span></p>
      <p><strong>Profil :</strong> Étudiants Master / Bureautique.</p>
      <ul class="deal-list"><li><strong>Remise étudiante</strong> appliquée.</li></ul></div>
    <div class="card deal-card" style="border-color:#f97316"><h3>🌪️ Mistral Pro</h3><p class="deal-price">5,99 € <span>/ mois</span></p>
      <p><strong>Profil :</strong> Souveraineté européenne / Code.</p>
      <ul class="deal-list"><li><strong>Offre étudiante :</strong> valable 12 mois.</li><li>Le leader français de l'IA.</li></ul></div>
    <div class="card deal-card" style="border-color:#06b6d4"><h3>🔍 Perplexity Pro</h3><p class="deal-price">~10,00 € <span>/ mois</span></p>
      <p><strong>Profil :</strong> Recherche académique poussée.</p>
      <ul class="deal-list"><li><strong>Remise 50 % :</strong> via SheerID.</li><li>Accès à plusieurs modèles de pointe.</li></ul></div>
    <div class="card deal-card"><h3>${ICONS.claude} Claude Pro</h3><p class="deal-price">~22,00 € <span>(20 $)</span></p>
      <p><strong>Profil :</strong> Développeurs avancés.</p>
      <ul class="deal-list"><li>Pas d'offre étudiante connue : <a href="https://claude.com/pricing" target="_blank" rel="noopener noreferrer"><u>vérifier</u></a>.</li></ul></div>
    <div class="card deal-card"><h3>${ICONS.chatgpt} ChatGPT Plus</h3><p class="deal-price">~22,00 € <span>(20 $)</span></p>
      <p><strong>Profil :</strong> Grand public / Mode vocal.</p>
      <ul class="deal-list"><li>Promo étudiante : <a href="https://openai.com/chatgpt/pricing/" target="_blank" rel="noopener noreferrer"><u>vérifier</u></a> selon ton pays.</li></ul></div>
  </div>`;

function render() {
  $("#nav").innerHTML = [["home","Accueil"],["claude","Claude"],["gemini","Gemini"],["chatgpt","ChatGPT"],["media","Médias"],["deals","Bons Plans"],["archive","Archive"]]
    .map(([k,l]) => `<button data-v="${k}" class="${k===view?"on":""}">${ICONS[k]||""} ${l}</button>`).join("");
  const news = store.filter(n => n.kind === "news");
  let h = "";
  if (view === "home") {
    h = `<div class="hero"><h1>Toute l'actualité IA, en français.</h1><p>Les annonces de Claude, Gemini et ChatGPT, traduites et mises à jour à chaque visite.</p></div>
         <h2>Dernières publications</h2>${grid(news.slice(0,12))}`;
  } else if (["claude","gemini","chatgpt","media"].includes(view)) {
    const list = store.filter(n => view === "media" ? n.kind === "media" : n.company === view);
    h = `<div class="hero"><h1>${view==="media" ? "Presse tech française" : "Actus " + NAMES[view]}</h1><p>${view==="media" ? "Ce que les médias français disent de l'IA." : "Publications officielles, traduites en français."}</p></div>${grid(list)}`;
  } else if (view === "archive") {
    const by = {}; news.forEach(n => (by[n.date.slice(0,7)] ||= []).push(n));
    h = `<div class="hero"><h1>Archive</h1><p>Les anciennes actualités, classées par mois.</p></div>` +
        (Object.keys(by).sort().reverse().map(m => `<h2>${new Date(m+"-01").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</h2>${grid(by[m])}`).join("") || `<p class="empty">Rien pour l'instant.</p>`);
  } else if (view === "deals") h = DEALS;
  $("#app").innerHTML = h;
  enrich();
}

document.addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { view = b.dataset.v; location.hash = view; scrollTo({top:0}); } });
addEventListener("hashchange", () => { view = location.hash.slice(1) || "home"; render(); });
$("#theme").onclick = () => { const d = document.documentElement, dark = getComputedStyle(d).getPropertyValue("--bg").trim() === "#1b1a18"; d.dataset.theme = dark ? "light" : "dark"; };

render(); load();
</script>
</body>
</html>
